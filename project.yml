name: Xephon
options:
  bundleIdPrefix: com.supatsaetia.xephon
  deploymentTarget:
    iOS: "26.0"
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
    # DEVELOPMENT_TEAM (+ CODE_SIGN_STYLE) live in
    # Config/Local.xcconfig — gitignored per-developer. The xcconfig
    # is wired into both signed targets (main app + widget
    # extension) via `configFiles` below; XcodeGen writes the
    # reference but never touches the file's contents, so the team
    # id you set there survives `./scripts/generate_project.sh`
    # regenerations. The bootstrap script copies
    # Config/Local.xcconfig.example → Config/Local.xcconfig on
    # first run so the reference always resolves.

configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig

packages:
  Xephon:
    path: .

targets:
  Xephon:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Xephon
        excludes:
          - "Info.plist"
      # Xcode 16 Icon Composer document. Compiled by the asset-catalog
      # compiler into the runtime app icon family. ASSETCATALOG_COMPILER_-
      # APPICON_NAME below tells the compiler which `.icon` to use.
      - path: Xephon.icon
        type: file
      # ML model weights (W2V2, emotion2vec, WRIME RoBERTa) are NOT
      # bundled — they ship via a GitHub Release attached to the
      # `models-v1` tag and download on first launch. See
      # `Xephon/Models/ModelStore.swift` and `scripts/upload_models_to_github_release.sh`.
    info:
      path: Xephon/Info.plist
      properties:
        CFBundleDisplayName: Xephon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        NSMicrophoneUsageDescription: "Xephon records short conversational audio to estimate per-speaker emotion. Audio is processed entirely on this device unless you toggle Cloud ASR fallback."
        NSSpeechRecognitionUsageDescription: "Xephon transcribes Japanese conversational audio on-device using Apple Speech."
        # Required for the optional LM Studio remote-LLM backend.
        # Disabled by default in Settings; when enabled, Xephon
        # POSTs post-ASR transcript text (no audio) to a user-
        # configured server on the local network. iOS shows this
        # string the first time the app initiates a TCP connection
        # to a local IP.
        NSLocalNetworkUsageDescription: "Xephon can off-load Summary and Reviewer LLM inference to an LM Studio server you run on your local network. Only the post-ASR transcript text is sent; audio never leaves this device."
        # `NSAllowsLocalNetworking = true` is a narrowly-scoped ATS
        # exception that permits plaintext HTTP only to local-
        # network destinations (link-local, .local Bonjour, RFC
        # 1918 private IPs). LM Studio's server is HTTP by default
        # and lives on the LAN, so this is the right grain — much
        # safer than `NSAllowsArbitraryLoads`, which would also
        # permit plaintext to the public internet.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        # Audio background mode keeps the AVAudioSession alive when the
        # user briefly tabs away (e.g. to Xcode or another app) during a
        # mic-mode recording so capture doesn't stall. This does NOT
        # preserve GPU/Metal/CoreML privileges — iOS still revokes those
        # for backgrounded apps regardless of background modes. CoreML EP
        # revocation is handled separately by `BackgroundAwareSER`'s
        # proactive foreground/background session swap, with the per-actor
        # reactive CPU-rebuild catch-shim as defense in depth.
        UIBackgroundModes:
          - audio
        # Required entitlement for ActivityKit Live Activities. Without
        # this key the system silently rejects `Activity.request`.
        NSSupportsLiveActivities: true
        # Register the `.xph` Xephon session bundle as an exported
        # UTType so the in-app file picker can grey out non-`.xph`
        # files when Import Session is invoked.
        #
        # We deliberately do NOT declare `CFBundleDocumentTypes`. As
        # soon as that key is present, iOS/macOS treats the app as
        # document-based and replaces our custom File menu items
        # (Open Audio, Import Session, Save Session, Export to JSON)
        # with the system's "Open / Open Recent" duo, suppressing
        # the SwiftUI `.commands { CommandGroup(replacing: .newItem)
        # … }` block. We don't need the document-app integration —
        # `.xph` files are only opened from within Xephon via our
        # own picker, so the exported UTType alone is enough for
        # filename-extension filtering.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.supatsaetia.xephon.session
            UTTypeDescription: Xephon Session
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - xph
              public.mime-type:
                - application/x-xephon-session
    settings:
      base:
        PRODUCT_NAME: Xephon
        PRODUCT_BUNDLE_IDENTIFIER: com.supatsaetia.xephon
        # Increased-memory-limit entitlement for on-device LLM
        # inference — see comment in Xephon/Xephon.entitlements.
        CODE_SIGN_ENTITLEMENTS: Xephon/Xephon.entitlements
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
        # Mac Catalyst is intentionally NOT supported: onnxruntime-swift-package-manager
        # ships no maccatalyst slice in its xcframework, which breaks SERAcoustic.
        # For Mac development run via "Designed for iPad" or use a real iPad.
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # Use the Xephon.icon Icon Composer document for the runtime app icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: Xephon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        # Disable user-script sandboxing on this target only. The
        # post-build script that patches `onnxruntime.framework`'s
        # MinimumOSVersion (vtool + plutil + codesign) needs to read
        # and write the embedded framework inside the .app bundle in
        # the archive's InstallationBuildProductsLocation, which
        # Xcode 26's sandbox blocks ("Operation not permitted" out of
        # vtool). Other targets keep the project-wide YES default.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: Xephon
        product: XephonCore
      - target: XephonWidget
        embed: true
        codeSign: true
    # Bump embedded onnxruntime.framework's MinimumOSVersion + Mach-O
    # LC_BUILD_VERSION minos to match the app's deployment target.
    # The SPM artifact ships with minos=15.1, which trips App Store
    # Connect's ITMS-90208 ("does not support the minimum OS Version
    # specified in the Info.plist") because the embedded framework's
    # min must be >= the parent app's. Patching after the Embed
    # Frameworks phase invalidates the SPM-provided code signature;
    # we re-sign with the active identity so the app bundle stays
    # valid. Runs only for device archives ($PLATFORM_NAME =
    # iphoneos) since simulator builds don't go through store
    # validation and the framework would be in a different slice
    # anyway. No-op if `onnxruntime` is missing (e.g. a future
    # build removed it).
    postBuildScripts:
      - name: "Bump onnxruntime.framework minOS"
        # Only runs during archive (`xcodebuild archive` / Product →
        # Archive). Debug device builds skip it entirely — they
        # don't go through App Store validation, and the script's
        # vtool+resign dance is only needed for upload-bound bundles.
        runOnlyWhenInstalling: true
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          if [ "${ACTION:-}" != "install" ]; then
            echo "note: skipping onnxruntime minOS bump (ACTION=${ACTION:-unset})"
            exit 0
          fi
          if [ "${PLATFORM_NAME}" != "iphoneos" ]; then
            echo "note: skipping onnxruntime minOS bump on ${PLATFORM_NAME}"
            exit 0
          fi
          FRAMEWORK="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/onnxruntime.framework"
          if [ ! -d "$FRAMEWORK" ]; then
            echo "note: onnxruntime.framework not embedded; nothing to patch"
            exit 0
          fi
          IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:-${CODE_SIGN_IDENTITY:-}}"
          if [ -z "$IDENTITY" ]; then
            echo "warning: no code-sign identity available; cannot re-sign onnxruntime.framework after vtool patch"
            exit 0
          fi
          EXEC="$FRAMEWORK/onnxruntime"
          TARGET_MIN="${IPHONEOS_DEPLOYMENT_TARGET}"
          echo "Patching $FRAMEWORK to MinimumOSVersion=$TARGET_MIN"
          # 1. Bump Mach-O build version. `vtool -set-build-version`
          #    overwrites LC_BUILD_VERSION; platform 2 = iOS. Write
          #    to a temp file first so vtool isn't reading + writing
          #    the same path simultaneously.
          TMP_EXEC="$(mktemp)"
          xcrun vtool -set-build-version 2 "$TARGET_MIN" "$TARGET_MIN" \
            -replace -output "$TMP_EXEC" "$EXEC"
          mv "$TMP_EXEC" "$EXEC"
          chmod +x "$EXEC"
          # 2. Bump Info.plist.
          plutil -replace MinimumOSVersion -string "$TARGET_MIN" "$FRAMEWORK/Info.plist"
          # 3. Re-sign — vtool invalidates the embedded signature.
          #    Preserve identifier so the framework keeps its bundle id.
          /usr/bin/codesign --force --sign "$IDENTITY" \
            --preserve-metadata=identifier,entitlements,flags \
            --timestamp=none "$FRAMEWORK"

  XephonWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: XephonWidget
        excludes:
          - "Info.plist"
      # Compiled into both the main app target (via the `Xephon` source
      # path above) and this extension. ActivityKit identifies the
      # attributes type by name + Codable shape, so two compiled copies
      # interoperate fine.
      - path: Xephon/Live/XephonActivityAttributes.swift
        type: file
    info:
      path: XephonWidget/Info.plist
      properties:
        # `NSExtension` is mandatory for any app extension. Real-device
        # installd rejects appex bundles missing this dict with
        # MIInstallerErrorDomain code 39 (`AppexBundleMissingNSExtensionDict`);
        # simulator installd is lenient. WidgetKit extensions driven
        # by `@main WidgetBundle` only need the point identifier — the
        # principal class is resolved from the Swift `@main` entry.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # Both fields must match the parent app or the embedded
        # validation step warns: "CFBundleShortVersionString of an app
        # extension ('1.0') must match that of its containing parent
        # app ('0.1.0')." Reference the same build settings the main
        # target uses so they bump in lockstep.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # App Store Connect upload requires every appex bundle to carry
        # CFBundleDisplayName explicitly (validation error 90360 —
        # "Missing Info.plist value"). Required even though the widget
        # surface labels its own complications / Live Activity strings.
        CFBundleDisplayName: Xephon
    settings:
      base:
        PRODUCT_NAME: XephonWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.supatsaetia.xephon.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: NO
        SWIFT_EMIT_LOC_STRINGS: YES

  XephonTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Tests/UnitTests
    dependencies:
      - target: Xephon
      # `link: false` — XephonCore (and its static onnxruntime
      # xcframework) is already linked into the host app; this test
      # bundle runs inside the host via TEST_HOST, so it resolves
      # those symbols at runtime. Re-linking the static product here
      # makes the build system reject the duplicate ("linked as a
      # static library by … This will result in duplication of
      # library code"). The dependency is kept (not link) so the
      # `@testable import Fusion/SERAcoustic/SERText/Export` modules
      # stay discoverable for compilation.
      - package: Xephon
        product: XephonCore
        link: false
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Xephon.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Xephon"

  XephonEvalTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Tests/EvalTests
    dependencies:
      - target: Xephon
      # See XephonTests above — same static-onnxruntime duplication
      # avoidance. Symbols (incl. `@testable import ASR`) resolve
      # from the host app at runtime.
      - package: Xephon
        product: XephonCore
        link: false
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Xephon.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Xephon"

schemes:
  Xephon:
    build:
      targets:
        Xephon: all
        XephonTests: [test]
        XephonEvalTests: [test]
    run:
      # Release rather than Debug for the Run action so on-device installs
      # (especially over Wi-Fi) ship the stripped, optimized binary —
      # ~100 MB smaller than the Debug dylib. Tests still build Debug
      # (separate `test.config` below), so unit-test debugging is
      # unaffected. Use the Profile action (Cmd+I) for instrumentation
      # builds; use Archive for distribution.
      config: Release
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - XephonTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  XephonEval:
    build:
      targets:
        Xephon: all
        XephonEvalTests: [test]
    test:
      config: Debug
      targets:
        - XephonEvalTests
